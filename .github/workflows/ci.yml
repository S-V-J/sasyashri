name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ============================================
  # LINT & TYPECHECK
  # ============================================
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

  # ============================================
  # UNIT TESTS
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run unit tests
        run: pnpm test:unit
        env:
          DATABASE_URL: postgresql://sasyashri:test@localhost:5432/sasyashri_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_min_64_characters_long_for_testing
          JWT_REFRESH_SECRET: test_refresh_secret_min_64_characters_long_for_testing

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # ============================================
  # API CONTRACT TESTS
  # ============================================
  api-contract-tests:
    name: API Contract Tests
    runs-on: self-hosted
    timeout-minutes: 15
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Start test database
        run: |
          docker run -d --name test-postgres \
            -e POSTGRES_DB=sasyashri_test \
            -e POSTGRES_USER=sasyashri \
            -e POSTGRES_PASSWORD=test \
            -p 5432:5432 \
            postgres:16-alpine
          docker run -d --name test-redis \
            -p 6379:6379 \
            redis:7-alpine
          sleep 10

      - name: Run migrations
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://sasyashri:test@localhost:5432/sasyashri_test

      - name: Run API contract tests
        run: pnpm test:api
        env:
          DATABASE_URL: postgresql://sasyashri:test@localhost:5432/sasyashri_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_min_64_characters_long_for_testing
          JWT_REFRESH_SECRET: test_refresh_secret_min_64_characters_long_for_testing

      - name: Cleanup test databases
        if: always()
        run: |
          docker stop test-postgres test-redis
          docker rm test-postgres test-redis

  # ============================================
  # E2E TESTS
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: self-hosted
    timeout-minutes: 30
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Start services
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d postgres redis livekit
          sleep 15

      - name: Run migrations
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://sasyashri:sasyashri_dev_password@localhost:5432/sasyashri

      - name: Build applications
        run: pnpm build

      - name: Start applications
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d api web
          sleep 30

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://sasyashri:sasyashri_dev_password@localhost:5432/sasyashri
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_min_64_characters_long_for_testing
          JWT_REFRESH_SECRET: test_refresh_secret_min_64_characters_long_for_testing
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker compose -f infra/docker/docker-compose.yml down -v

  # ============================================
  # BUILD DOCKER IMAGES
  # ============================================
  build-images:
    name: Build Docker Images
    runs-on: self-hosted
    timeout-minutes: 30
    needs: [lint-and-typecheck, unit-tests, api-contract-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/sasyashri-api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/sasyashri-web
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

      - name: Extract metadata for OCR
        id: meta-ocr
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/sasyashri-ocr
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push OCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.ocr
          push: true
          tags: ${{ steps.meta-ocr.outputs.tags }}
          labels: ${{ steps.meta-ocr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

  # ============================================
  # DEPLOY TO STAGING
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: self-hosted
    timeout-minutes: 15
    needs: build-images
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/sasyashri
            docker compose -f infra/docker/docker-compose.prod.yml pull
            docker compose -f infra/docker/docker-compose.prod.yml up -d --remove-orphans
            docker compose -f infra/docker/docker-compose.prod.yml exec -T api pnpm db:migrate:deploy

      - name: Health check
        run: |
          sleep 30
          curl -f https://staging.sasyashri.duckdns.org/health || exit 1
          curl -f https://staging.sasyashri.duckdns.org/api/health || exit 1

  # ============================================
  # DEPLOY TO PRODUCTION
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: self-hosted
    timeout-minutes: 15
    needs: build-images
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/sasyashri
            docker compose -f infra/docker/docker-compose.prod.yml pull
            docker compose -f infra/docker/docker-compose.prod.yml up -d --remove-orphans
            docker compose -f infra/docker/docker-compose.prod.yml exec -T api pnpm db:migrate:deploy

      - name: Health check
        run: |
          sleep 30
          curl -f https://sasyashri.duckdns.org/health || exit 1
          curl -f https://sasyashri.duckdns.org/api/health || exit 1

      - name: Notify deployment
        if: always()
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK }} \
            -H "Content-Type: application/json" \
            -d '{"content": "🚀 Production deployment completed: ${{ github.sha }}"}' || true